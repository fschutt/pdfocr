name: OCR PDF Processing

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: 'Public URL of the input PDF (a scanned / image-only PDF)'
        required: true
        type: string
      lang:
        description: >-
          Document language(s) as Tesseract codes, main language first, joined with "+".
          Supported: eng, deu, deu_frak (German Fraktur), frk (Fraktur), fra, spa, ita, por, nld,
          pol, lat, rus, ukr, ara, chi_sim, chi_tra, jpn, kor. Example: deu+eng
        required: false
        default: 'eng'
        type: string
      engines:
        description: >-
          "all", or a comma-separated list of: tesseract, rapidocr, paddleocr, easyocr, doctr,
          surya, ocrmypdf, ocrmypdf_rapid, macos_vision (runs on a macOS runner).
          Named engines that cannot read the language are rejected; with "all" they are skipped.
        required: false
        default: 'all'
        type: string
      engine_options:
        description: >-
          Engine parameters, space-separated ENGINE.KEY=VALUE (empty = defaults), e.g.
          "tesseract.psm=6 macos_vision.level=fast". `pdf-ocr-bench engines` lists them all.
        required: false
        default: ''
        type: string
      preprocess:
        description: >-
          Image filters applied in order before OCR, comma-separated (empty = none): grayscale,
          autocontrast, denoise, sharpen, binarize, deskew. Example: grayscale,deskew,denoise
        required: false
        default: ''
        type: string
      dpi:
        description: 'Render DPI of the page images the engines read (150 = fast/draft, 300 = default, 600 = small print)'
        required: false
        default: '300'
        type: string
      page_range:
        description: 'Pages to process, e.g. "1-5" or "1,3,7-10" (empty = all pages)'
        required: false
        default: ''
        type: string
      timeout_per_page:
        description: 'Max seconds per page per engine before the page is skipped (0 = no limit)'
        required: false
        default: '300'
        type: string

# Inputs reach the shell only through env vars (never ${{ }} inside `run:`), so a crafted
# input cannot inject commands.
env:
  PDF_URL: ${{ inputs.pdf_url }}
  OCR_LANG: ${{ inputs.lang }}
  OCR_ENGINES: ${{ inputs.engines }}
  OCR_PREPROCESS: ${{ inputs.preprocess }}
  OCR_ENGINE_OPTIONS: ${{ inputs.engine_options }}
  OCR_DPI: ${{ inputs.dpi }}
  OCR_PAGES: ${{ inputs.page_range }}
  OCR_TIMEOUT: ${{ inputs.timeout_per_page }}
  PYTHONUNBUFFERED: '1'
  PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'

jobs:
  # Reject bad input in about a minute, before any engine is installed.
  validate:
    runs-on: ubuntu-latest
    outputs:
      linux_engines: ${{ steps.split.outputs.linux_engines }}
      run_linux: ${{ steps.split.outputs.run_linux }}
      run_macos: ${{ steps.split.outputs.run_macos }}
      tesseract_packages: ${{ steps.split.outputs.tesseract_packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Validate inputs and show the engine routing
        run: |
          [[ "$OCR_DPI" =~ ^[0-9]+$ ]] || { echo "::error::dpi must be a number, got '$OCR_DPI'"; exit 1; }
          [[ "$OCR_TIMEOUT" =~ ^[0-9]+$ ]] || { echo "::error::timeout_per_page must be a number, got '$OCR_TIMEOUT'"; exit 1; }
          args=(--lang "$OCR_LANG" --engines "$OCR_ENGINES" --preprocess "$OCR_PREPROCESS")
          [ -n "$OCR_PAGES" ] && args+=(--pages "$OCR_PAGES")
          read -ra opts <<< "$OCR_ENGINE_OPTIONS"
          for o in "${opts[@]}"; do args+=(-O "$o"); done
          if ! out=$(pdf-ocr-bench check "${args[@]}" 2>&1); then
            echo "$out"
            echo "::error::$(echo "$out" | tail -1)"
            exit 1
          fi
          echo "$out"
      - name: Split engines between the Linux and macOS jobs
        id: split
        run: |
          engines=$(echo "$OCR_ENGINES" | tr 'A-Z-' 'a-z_' | tr -d ' ')
          if [ "$engines" = "all" ]; then
            # like every engine under "all": skipped when it cannot read --lang
            linux=all
            macos=$(pdf-ocr-bench check --lang "$OCR_LANG" --engines macos_vision >/dev/null 2>&1 && echo true || echo false)
          else
            linux=$(echo "$engines" | tr ',' '\n' | grep -vx 'macos_vision' | paste -sd, - || true)
            macos=$(echo ",$engines," | grep -q ',macos_vision,' && echo true || echo false)
          fi
          {
            echo "linux_engines=$linux"
            echo "run_linux=$([ -n "$linux" ] && echo true || echo false)"
            echo "run_macos=$macos"
            echo "tesseract_packages=$(pdf-ocr-bench tesseract-packages --lang "$OCR_LANG" | paste -sd' ' -)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  ocr:
    needs: validate
    if: needs.validate.outputs.run_linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LINUX_ENGINES: ${{ needs.validate.outputs.linux_engines }}
      TESSERACT_PACKAGES: ${{ needs.validate.outputs.tesseract_packages }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system deps + the Tesseract models for --lang
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # word splitting of the package list is intended
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr ghostscript poppler-utils libgl1 \
            libglib2.0-0 libsm6 libxext6 libxrender1 \
            qpdf unpaper pngquant $TESSERACT_PACKAGES
          echo "Installed Tesseract models:"
          tesseract --list-langs

      - name: Install llama.cpp (CPU backend for Surya 2)
        if: contains(env.LINUX_ENGINES, 'surya') || env.LINUX_ENGINES == 'all'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/llama.cpp"
          if gh release download --repo ggml-org/llama.cpp --pattern '*bin-ubuntu-x64.zip' --dir /tmp/llama; then
            unzip -q /tmp/llama/*.zip -d "$HOME/llama.cpp"
            bin_dir=$(dirname "$(find "$HOME/llama.cpp" -name llama-server -type f | head -1)")
            echo "$bin_dir" >> "$GITHUB_PATH"
            echo "LD_LIBRARY_PATH=$bin_dir:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            "$bin_dir/llama-server" --version || true
          else
            echo "::warning::Could not download llama.cpp; Surya will be skipped"
          fi

      - name: Install Python deps
        # [ci] = all engines minus olmocr (macos-vision is macOS-only and a no-op here)
        run: |
          pip install --upgrade pip
          pip install -e ".[ci]"

      - name: Pre-download models
        run: |
          echo "::group::Model downloads (lang=$OCR_LANG)"
          args=(--lang "$OCR_LANG" --engines "$LINUX_ENGINES")
          read -ra opts <<< "$OCR_ENGINE_OPTIONS"
          for o in "${opts[@]}"; do [[ "$o" == macos_vision.* || "$o" == macos-vision.* ]] || args+=(-O "$o"); done
          pdf-ocr-bench warmup "${args[@]}"
          echo "::endgroup::"

      - name: Download input PDF
        run: |
          curl -fSL --max-filesize 500000000 -o input.pdf "$PDF_URL"
          echo "File size: $(du -h input.pdf | cut -f1)"
          echo "Pages: $(python -c "import pymupdf; print(len(pymupdf.open('input.pdf')))")"

      - name: Run OCR pipeline
        run: |
          args=(input.pdf -o results --engines "$LINUX_ENGINES" --lang "$OCR_LANG" --dpi "$OCR_DPI"
                --preprocess "$OCR_PREPROCESS" --timeout-per-page "$OCR_TIMEOUT" --report results/report.json -v)
          [ -n "$OCR_PAGES" ] && args+=(--pages "$OCR_PAGES")
          # macOS Vision options belong to the macOS job
          read -ra opts <<< "$OCR_ENGINE_OPTIONS"
          for o in "${opts[@]}"; do [[ "$o" == macos_vision.* || "$o" == macos-vision.* ]] || args+=(-O "$o"); done
          echo "Running: pdf-ocr-bench run ${args[*]}"
          set -o pipefail
          pdf-ocr-bench run "${args[@]}" 2>&1 | tee ocr.log

      - name: Upload engine results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-results
          # the page renders are only OCR input; the zips and the report are the results
          path: |
            results/
            !results/images/
          retention-days: 30

      - name: List engine zips
        if: always()
        run: |
          for dir in results/*/; do
            engine=$(basename "$dir")
            [ -f "$dir/pages.zip" ] && echo "Found results for engine: $engine ($(du -h "$dir/pages.zip" | cut -f1))"
          done
          true

      # One artifact per engine, for easy download
      - name: Upload tesseract
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('results/tesseract/pages.zip') != ''
        with:
          name: ocr-tesseract
          path: results/tesseract/pages.zip

      - name: Upload rapidocr
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('results/rapidocr/pages.zip') != ''
        with:
          name: ocr-rapidocr
          path: results/rapidocr/pages.zip

      - name: Upload paddleocr
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('results/paddleocr/pages.zip') != ''
        with:
          name: ocr-paddleocr
          path: results/paddleocr/pages.zip

      - name: Upload easyocr
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('results/easyocr/pages.zip') != ''
        with:
          name: ocr-easyocr
          path: results/easyocr/pages.zip

      - name: Upload doctr
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('results/doctr/pages.zip') != ''
        with:
          name: ocr-doctr
          path: results/doctr/pages.zip

      - name: Upload surya
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('results/surya/pages.zip') != ''
        with:
          name: ocr-surya
          path: results/surya/pages.zip

      - name: Upload ocrmypdf
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('results/ocrmypdf/pages.zip') != ''
        with:
          name: ocr-ocrmypdf
          path: results/ocrmypdf/pages.zip

      - name: Upload ocrmypdf-rapid
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('results/ocrmypdf_rapid/pages.zip') != ''
        with:
          name: ocr-ocrmypdf-rapid
          path: results/ocrmypdf_rapid/pages.zip

      - name: Upload report & logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-report
          path: |
            results/report.json
            ocr.log

      - name: Summary
        if: always()
        run: |
          echo "## OCR Results (Linux)" >> "$GITHUB_STEP_SUMMARY"
          [ -f results/report.json ] || exit 0
          python3 scripts/report_summary.py results/report.json >> "$GITHUB_STEP_SUMMARY"

  ocr-macos-vision:
    needs: validate
    if: needs.validate.outputs.run_macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[macos-vision]"
      - name: Download input PDF
        run: curl -fSL --max-filesize 500000000 -o input.pdf "$PDF_URL"
      - name: Run macOS Vision
        run: |
          args=(input.pdf -o results --engines macos_vision --lang "$OCR_LANG" --dpi "$OCR_DPI"
                --preprocess "$OCR_PREPROCESS" --timeout-per-page "$OCR_TIMEOUT" --report results/report.json -v)
          [ -n "$OCR_PAGES" ] && args+=(--pages "$OCR_PAGES")
          read -ra opts <<< "$OCR_ENGINE_OPTIONS"
          for o in "${opts[@]}"; do [[ "$o" == macos_vision.* || "$o" == macos-vision.* ]] && args+=(-O "$o"); done
          set -o pipefail
          pdf-ocr-bench run "${args[@]}" 2>&1 | tee ocr-macos-vision.log
      - name: Upload macos_vision
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('results/macos_vision/pages.zip') != ''
        with:
          name: ocr-macos-vision
          path: results/macos_vision/pages.zip
      - name: Upload report & logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-report-macos-vision
          path: |
            results/report.json
            ocr-macos-vision.log
      - name: Summary
        if: always()
        run: |
          echo "## OCR Results (macOS Vision)" >> "$GITHUB_STEP_SUMMARY"
          [ -f results/report.json ] || exit 0
          python3 scripts/report_summary.py results/report.json >> "$GITHUB_STEP_SUMMARY"
