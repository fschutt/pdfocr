[package]
name = "html2pdf"
version = "0.1.0"
edition = "2021"
description = "Convert a pdf-ocr-bench pages.zip (positioned HTML + page images) into a searchable PDF"
license = "MIT"
publish = false

[dependencies]
printpdf = { version = "0.12.8", features = ["html", "png", "jpeg"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
